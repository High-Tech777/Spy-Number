<html>
    <head>
        <title>Spy Number Checker</title>
        <link rel="stylesheet" href="index.css">
        <script src="index.js" defer></script>
    </head>
    <body>
        <div class="container">
            <h1 class="title">Spy Number Checker</h1>
            <div class="content">
                <input type="number" id="number" placeholder="Input the number">

            </div>
            <p id="result"></p>
        </div>
    </body>
</html>
